version: '3.8'

services:
  # MySQL 資料庫
  db:
    image: mysql:8.0
    container_name: bakery_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bakery_dev}
      MYSQL_USER: ${MYSQL_USER:-bakery_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bakery_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bakery_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask 應用程式
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bakery_web
    restart: unless-stopped
    environment:
      FLASK_ENV: ${FLASK_ENV:-development}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-bakery_user}:${MYSQL_PASSWORD:-bakery_pass}@db:3306/${MYSQL_DATABASE:-bakery_dev}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jwt-secret-key-change-in-production}
    ports:
      - "5000:5000"
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bakery_network
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 10 &&
        flask db upgrade &&
        gunicorn --bind 0.0.0.0:5000 --workers 4 --timeout 120 --reload wsgi:app
      "

  # Nginx 反向代理（生產環境）
  nginx:
    image: nginx:alpine
    container_name: bakery_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    networks:
      - bakery_network
    profiles:
      - production

  # Redis（快取）
  redis:
    image: redis:7-alpine
    container_name: bakery_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bakery_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    profiles:
      - production

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  bakery_network:
    driver: bridge