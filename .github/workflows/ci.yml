name: CI Pipeline

# 設定觸發時機
on:
  # 1. 當有人發起 Pull Request 要合併到 main 時
  pull_request:
    branches: ["main", "release"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. 下載你的程式碼
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 設定 Python 環境 (依照你本機的 3.13)
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 3. 安裝依賴套件
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 執行測試
      - name: Run Tests
        # 設定 PYTHONPATH 為當前目錄，確保 run.py 和 app/ 能被正確引用
        env:
          PYTHONPATH: .
        run: |
          pytest
